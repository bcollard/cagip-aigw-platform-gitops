# An entity namespace, owned by CAGIP: one per entity, holding the entity's AI Gateway. Labels and
# annotations are the entity's governance parameters, read by the VAPs. Entities have no rights
# on Namespace objects.
apiVersion: v1
kind: Namespace
metadata:
  name: lcl
  labels:
    cagip.io/entity: lcl
    cagip.io/token-cap-per-hour: "200000"
    cagip.io/payload-logging: denied
  annotations:
    cagip.io/display-name: "LCL"
    cagip.io/aigw: lcl-aigw
    cagip.io/llm-provider-types: "gemini,openai"
    cagip.io/llm-hosts: "mock-vertex.lclv2.demo.internal,ollama.aigw-backends.svc.cluster.local"
    cagip.io/mcp-hosts: "agences-api.aigw-backends.svc.cluster.local"
    cagip.io/hostnames: "ai-lcl.lclv2.demo.internal"
