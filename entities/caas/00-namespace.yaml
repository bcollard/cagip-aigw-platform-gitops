# An entity namespace, owned by CAGIP: one per entity, holding the entity's AI Gateway. Labels and
# annotations are the entity's governance parameters, read by the VAPs. Entities have no rights
# on Namespace objects.
apiVersion: v1
kind: Namespace
metadata:
  name: caas
  labels:
    cagip.io/entity: caas
    cagip.io/token-cap-per-hour: "100000"
    cagip.io/payload-logging: denied
  annotations:
    cagip.io/display-name: "CA Assurances"
    cagip.io/aigw: caas-aigw
    cagip.io/llm-provider-types: "openai"
    cagip.io/llm-hosts: ""
    cagip.io/mcp-hosts: ""
    cagip.io/hostnames: "ai-caas.lclv2.demo.internal"
