# CAGIP AIOps stream: observability policies pushed into every entity namespace by the AIOps
# pipeline (SA cagip-platform/aiops-gitops), independently of the platform core and of the
# entity. The VAPs let this identity manage aiops-* AIGatewayPolicies labelled
# cagip.io/stream=aiops of observability types only.
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayPolicy
metadata: { name: aiops-prometheus, namespace: caas, labels: { cagip.io/owner: platform, cagip.io/stream: aiops } }
spec:
  aiGatewayRef: { group: aigateway.konghq.com, kind: OnPremAIGateway, namespacedRef: { name: caas-aigw } }
  apiSpec:
    name: aiops-prometheus
    displayName: AIOps · Prometheus
    type: prometheus
    global: Enabled
    config:
      type: inline
      value:
        ai_metrics: true
        per_consumer: false            # per-user analytics come from logs (sub)
        status_code_metrics: true
        latency_metrics: true
        bandwidth_metrics: true
        upstream_health_metrics: true
---
apiVersion: aiconfiguration.konghq.com/v1alpha1
kind: AIGatewayPolicy
metadata: { name: aiops-otel, namespace: caas, labels: { cagip.io/owner: platform, cagip.io/stream: aiops } }
spec:
  aiGatewayRef: { group: aigateway.konghq.com, kind: OnPremAIGateway, namespacedRef: { name: caas-aigw } }
  apiSpec:
    name: aiops-otel
    displayName: AIOps · OpenTelemetry
    type: opentelemetry
    global: Enabled
    config:
      type: inline
      value:
        traces_endpoint: http://otel.lclv2.demo.internal:4318/v1/traces
        access_logs:
          endpoint: http://otel.lclv2.demo.internal:4318/v1/logs
          custom_attributes_by_lua:
            lcl.team: "return kong.ctx.shared.lcl_team"
        resource_attributes:
          service.name: caas-aigw