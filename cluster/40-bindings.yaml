# Bindings: every VAP applies to entity namespaces (label cagip.io/entity). Deleting them
# (VAPS=off ./06-platform.sh) leaves RBAC alone, for the comparison.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: { name: aigw-ownership, labels: { lcl.demo/governance: vap } }
spec:
  policyName: aigw-ownership
  validationActions: [Deny]
  matchResources: { namespaceSelector: { matchExpressions: [{ key: cagip.io/entity, operator: Exists }] } }
---
