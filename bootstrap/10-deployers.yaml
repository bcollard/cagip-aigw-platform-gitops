# The two identities Argo CD syncs as. Cluster bootstrap, not part of either chart.
#   platform-deployer   cluster-admin: installs CRDs, the operator, admission policies, RBAC
#   entity-deployer     no rights here: the platform chart grants it the Role entity-ai-config in
#                       namespace ai-gateway, and its VAPs check what it writes
apiVersion: v1
kind: ServiceAccount
metadata: { name: platform-deployer, namespace: argocd }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: cagip-platform-deployer }
subjects: [{ kind: ServiceAccount, name: platform-deployer, namespace: argocd }]
roleRef: { kind: ClusterRole, name: cluster-admin, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: entity-deployer, namespace: argocd }
