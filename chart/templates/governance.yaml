# ValidatingAdmissionPolicies on the entity's AI configuration. Scope:
#   - namespace {{ .Values.gateway.namespace }} only (bindings);
#   - every identity except the platform's (matchCondition not-platform): the platform deployer,
#     Kong Operator, kube-system controllers, system:masters (break-glass).
# Parameters come from .Values.governance, rendered into the CEL: changing a limit is a commit to
# this chart's values, synced by the platform Application.
#
# RBAC (entity-rbac.yaml) decides WHICH kinds the entity writes; these decide WHAT they contain.
{{- $g := .Values.governance }}
{{- $ns := .Values.gateway.namespace }}
{{- $required := list .Values.mandatoryPolicies.stripIdentity.name .Values.mandatoryPolicies.baselineGuard.name }}
---
# aigw-platform-objects — objects labelled cagip.io/owner belong to this chart.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: aigw-platform-objects, labels: { app.kubernetes.io/part-of: cagip-aigw-platform } }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - { apiGroups: [aiconfiguration.konghq.com], apiVersions: ["*"], operations: [CREATE, UPDATE, DELETE], resources: ["*"] }
  matchConditions:
    {{- include "cagip.notPlatform" . | nindent 4 }}
  variables:
    - name: newLabels
      expression: "object != null && has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: oldLabels
      expression: "oldObject != null && has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
    - name: name
      expression: "object != null ? object.metadata.name : oldObject.metadata.name"
  validations:
    - expression: "!('cagip.io/owner' in variables.oldLabels) && !('cagip.io/owner' in variables.newLabels)"
      message: "objects labelled cagip.io/owner belong to the CAGIP platform chart"
      reason: Forbidden
    - expression: "!variables.name.startsWith('cagip-')"
      message: "cagip-* names are reserved for the CAGIP platform chart"
      reason: Forbidden
---
# aigw-policies — which policy types, and how they are scoped.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: aigw-policies, labels: { app.kubernetes.io/part-of: cagip-aigw-platform } }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - { apiGroups: [aiconfiguration.konghq.com], apiVersions: ["*"], operations: [CREATE, UPDATE], resources: [aigatewaypolicies] }
  matchConditions:
    {{- include "cagip.notPlatform" . | nindent 4 }}
  variables:
    - name: type
      expression: "has(object.spec.apiSpec.type) ? object.spec.apiSpec.type : ''"
    - name: cfg
      expression: >-
        has(object.spec.apiSpec.config) && object.spec.apiSpec.config.type == 'inline' &&
        has(object.spec.apiSpec.config.value) ? object.spec.apiSpec.config.value : {}
  validations:
    - expression: "variables.type in {{ include "cagip.cel" $g.policyTypes }}"
      messageExpression: >-
        variables.type == '' ? 'custom (Lua) policies belong to the platform'
        : "policy type '" + variables.type + "' is not open to the entity (governance.policyTypes)"
      reason: Forbidden
    - expression: "!has(object.spec.apiSpec.global) || object.spec.apiSpec.global != 'Enabled'"
      message: "global policies belong to the platform: attach entity policies through a Model's or MCP server's policies[]"
      reason: Forbidden
    - expression: "has(object.spec.apiSpec.config) && object.spec.apiSpec.config.type == 'inline'"
      message: "policy config is inline; credentials go through {vault://env/entity-…} references"
      reason: Forbidden
    - expression: >-
        !['request_prompt_count_function', 'custom_cost_count_function', 'custom_fields_by_lua', 'custom_attributes_by_lua']
          .exists(f, f in variables.cfg)
      message: "no Lua in entity policies (*_function, *_by_lua fields)"
      reason: Forbidden
---
# aigw-models — what every Model carries, and where it may send traffic.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: aigw-models, labels: { app.kubernetes.io/part-of: cagip-aigw-platform } }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - { apiGroups: [aiconfiguration.konghq.com], apiVersions: ["*"], operations: [CREATE, UPDATE], resources: [aigatewaymodels] }
  matchConditions:
    {{- include "cagip.notPlatform" . | nindent 4 }}
  variables:
    - name: m
      expression: "has(object.spec.apiSpec.model) ? object.spec.apiSpec.model : null"
    - name: pol
      expression: "variables.m != null && has(variables.m.policies) ? variables.m.policies.map(p, p.name) : []"
    - name: hosts
      expression: "{{ include "cagip.cel" $g.llmHosts }}"
  validations:
    - expression: "object.spec.apiSpec.type == 'model' && variables.m != null"
      message: "entity Models use type: model"
      reason: Forbidden
    - expression: >-
        has(variables.m.access) && has(variables.m.access.authStrategies) &&
        variables.m.access.authStrategies.exists(a, a.name == '{{ .Values.auth.name }}')
      message: "every Model lists the central auth strategy {{ .Values.auth.name }}"
      reason: Forbidden
    - expression: "{{ include "cagip.cel" $required }}.all(r, r in variables.pol)"
      message: "every Model attaches the mandatory policies {{ join ", " $required }}"
      reason: Forbidden
    {{- if not $g.payloadLogging }}
    - expression: >-
        !has(variables.m.config.logging) || !has(variables.m.config.logging.payloads) ||
        variables.m.config.logging.payloads != 'Enabled'
      message: "payload logging is off on this cluster (governance.payloadLogging): prompts carry PII"
      reason: Forbidden
    {{- end }}
    - expression: "variables.m.targets.all(t, !has(t.allowAuthOverride) || t.allowAuthOverride != 'Enabled')"
      message: "allowAuthOverride would let a client send its own provider credentials"
      reason: Forbidden
    - expression: >-
        variables.m.targets.all(t,
          (!has(t.config.openai) || !has(t.config.openai.upstreamURL) || url(t.config.openai.upstreamURL).getHostname() in variables.hosts) &&
          (!has(t.config.gemini) || (
            (!has(t.config.gemini.upstreamURL) || url(t.config.gemini.upstreamURL).getHostname() in variables.hosts) &&
            (!has(t.config.gemini.gcpEnvironment) || !has(t.config.gemini.gcpEnvironment.apiEndpoint) ||
              t.config.gemini.gcpEnvironment.apiEndpoint in variables.hosts))))
      message: "target endpoint host not allowed (governance.llmHosts)"
      reason: Forbidden
---
# aigw-model-providers — which provider types, which endpoints, and keys only by reference to
# the entity's credentials Secret (never inline, never another Secret of the namespace).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: aigw-model-providers, labels: { app.kubernetes.io/part-of: cagip-aigw-platform } }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - { apiGroups: [aiconfiguration.konghq.com], apiVersions: ["*"], operations: [CREATE, UPDATE], resources: [aigatewaymodelproviders] }
  matchConditions:
    {{- include "cagip.notPlatform" . | nindent 4 }}
  variables:
    # Map-style access: the arm is named by apiSpec.type.
    - name: auth
      expression: >-
        object.spec.apiSpec.type in object.spec.apiSpec && 'auth' in object.spec.apiSpec[object.spec.apiSpec.type].config
          ? object.spec.apiSpec[object.spec.apiSpec.type].config.auth : {}
    - name: values
      expression: >-
        ('headers' in variables.auth ? variables.auth.headers.map(h, h.value) : []) +
        ('params' in variables.auth ? variables.auth.params.map(p, p.value) : []) +
        ('basic' in variables.auth && 'headers' in variables.auth.basic ? variables.auth.basic.headers.map(h, h.value) : []) +
        ('basic' in variables.auth && 'params' in variables.auth.basic ? variables.auth.basic.params.map(p, p.value) : []) +
        ('gcp' in variables.auth && 'serviceAccountJSON' in variables.auth.gcp ? [variables.auth.gcp.serviceAccountJSON] : [])
    - name: urls
      expression: >-
        ('gcp' in variables.auth && 'oauthTokenURL' in variables.auth.gcp ? [variables.auth.gcp.oauthTokenURL] : []) +
        ('gcp' in variables.auth && 'metadataURL' in variables.auth.gcp ? [variables.auth.gcp.metadataURL] : [])
  validations:
    - expression: "object.spec.apiSpec.type in {{ include "cagip.cel" $g.providerTypes }}"
      messageExpression: "'provider type ' + object.spec.apiSpec.type + ' not allowed (governance.providerTypes: {{ join "," $g.providerTypes }})'"
      reason: Forbidden
    - expression: >-
        variables.values.all(v, v.type == 'secretRef' && v.secretRef.name == '{{ $g.credentialsSecret }}' &&
          (!('namespace' in v.secretRef) || v.secretRef.namespace == request.namespace))
      message: "provider credentials are secretRefs to the Secret {{ $g.credentialsSecret }}, never inline"
      reason: Forbidden
    - expression: "variables.urls.all(u, url(u).getHostname() in {{ include "cagip.cel" $g.llmHosts }})"
      message: "GCP token/metadata endpoint host not allowed (governance.llmHosts)"
      reason: Forbidden
---
# aigw-mcp-servers — conversion-listener only, allowed upstreams, central auth.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: aigw-mcp-servers, labels: { app.kubernetes.io/part-of: cagip-aigw-platform } }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - { apiGroups: [aiconfiguration.konghq.com], apiVersions: ["*"], operations: [CREATE, UPDATE], resources: [aigatewaymcpservers] }
  matchConditions:
    {{- include "cagip.notPlatform" . | nindent 4 }}
  variables:
    # Map-style access: has(apiSpec.conversion__dash__listener) does not resolve on this CRD.
    - name: cl
      expression: "'conversion-listener' in object.spec.apiSpec ? [object.spec.apiSpec['conversion-listener']] : []"
    - name: hosts
      expression: "{{ include "cagip.cel" $g.mcpHosts }}"
  validations:
    - expression: "object.spec.apiSpec.type == 'conversion-listener'"
      message: "entity MCP servers are conversion-listener (REST API → MCP tools); proxying an MCP server needs the platform"
      reason: Forbidden
    - expression: >-
        variables.cl.all(s, url(s.config.url).getHostname() in variables.hosts &&
          (!has(s.tools) || s.tools.all(t, !has(t.host) || t.host in variables.hosts)))
      message: "MCP upstream host not allowed (governance.mcpHosts)"
      reason: Forbidden
    - expression: >-
        variables.cl.all(s, has(s.access) && has(s.access.consumer) && has(s.access.consumer.authStrategies) &&
          s.access.consumer.authStrategies.exists(a, a.name == '{{ .Values.auth.name }}'))
      message: "every MCP server lists the central auth strategy {{ .Values.auth.name }}"
      reason: Forbidden
---
# aigw-token-cap — usage plans: shared counters (Redis), a total budget, every token limit under
# the cluster's cap.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: { name: aigw-token-cap, labels: { app.kubernetes.io/part-of: cagip-aigw-platform } }
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - { apiGroups: [aiconfiguration.konghq.com], apiVersions: ["*"], operations: [CREATE, UPDATE], resources: [aigatewaypolicies] }
  matchConditions:
    {{- include "cagip.notPlatform" . | nindent 4 }}
    - name: is-ai-rate-limit
      expression: "has(object.spec.apiSpec.type) && object.spec.apiSpec.type == 'ai-rate-limiting-advanced'"
  variables:
    - name: cfg
      expression: >-
        object.spec.apiSpec.config.type == 'inline' && has(object.spec.apiSpec.config.value) ? object.spec.apiSpec.config.value : {}
    - name: policies
      expression: "'policies' in variables.cfg ? variables.cfg.policies : []"
  validations:
    - expression: "'strategy' in variables.cfg && variables.cfg.strategy == 'redis'"
      message: "strategy must be redis: local counters are per pod"
      reason: Forbidden
    - expression: "variables.policies.exists(p, !('match' in p) || size(p.match) == 0)"
      message: "the usage plan needs one policy with no match: the entity's total budget"
      reason: Forbidden
    - expression: >-
        variables.policies.all(p, !('limits' in p) || p.limits.all(l,
          ('tokens_count_strategy' in l && l.tokens_count_strategy == 'cost') ||
          double(l.limit) * 3600.0 / double(l.window_size) <= {{ $g.tokenCapPerHour | float64 }}))
      message: "a token limit is above the cap of {{ $g.tokenCapPerHour }} tokens/hour (governance.tokenCapPerHour)"
      reason: Forbidden
{{- range list "aigw-platform-objects" "aigw-policies" "aigw-models" "aigw-model-providers" "aigw-mcp-servers" "aigw-token-cap" }}
---
{{ include "cagip.binding" (dict "name" . "ns" $ns) }}
{{- end }}
